<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper Transcriber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }
        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #764ba2;
        }
        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }
        .upload-text {
            color: #666;
            font-size: 16px;
        }
        #fileInput {
            display: none;
        }
        .file-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .file-info.show {
            display: block;
        }
        .transcribe-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .transcribe-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .transcribe-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .result-area {
            margin-top: 30px;
            display: none;
        }
        .result-area.show {
            display: block;
        }
        .result-box {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
        }
        .result-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .result-text {
            color: #555;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .language-badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 10px;
            padding: 15px;
            color: #c33;
            margin-top: 15px;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 Whisper Transcriber</h1>
        <p class="subtitle">Transcreva áudio automaticamente com IA</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <p class="upload-text">Arraste e solte seu arquivo de áudio aqui ou clique para selecionar</p>
            <p style="font-size: 12px; color: #999; margin-top: 10px;">Formatos: WAV, MP3, FLAC, M4A, OGG, WEBM (máx. 16MB)</p>
        </div>
        <input type="file" id="fileInput" accept=".wav,.mp3,.flac,.m4a,.ogg,.webm">
        
        <div class="file-info" id="fileInfo">
            <strong>Arquivo selecionado:</strong> <span id="fileName"></span>
        </div>
        
        <button class="transcribe-btn" id="transcribeBtn" disabled>Transcrever Áudio</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processando áudio... Isso pode levar alguns segundos.</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-area" id="resultArea">
            <div class="result-label">Transcrição:</div>
            <div class="result-box">
                <p class="result-text" id="transcription"></p>
                <span class="language-badge" id="language"></span>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('resultArea');
        const transcription = document.getElementById('transcription');
        const language = document.getElementById('language');
        const error = document.getElementById('error');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        let selectedFile = null;

        function handleFile(file) {
            const validTypes = ['audio/wav', 'audio/mpeg', 'audio/flac', 'audio/mp4', 'audio/ogg', 'audio/webm'];
            const validExtensions = ['.wav', '.mp3', '.flac', '.m4a', '.ogg', '.webm'];
            
            const extension = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validExtensions.includes(extension)) {
                showError('Formato de arquivo não suportado. Use: WAV, MP3, FLAC, M4A, OGG ou WEBM');
                return;
            }
            
            if (file.size > 16 * 1024 * 1024) {
                showError('Arquivo muito grande. Máximo: 16MB');
                return;
            }
            
            selectedFile = file;
            fileName.textContent = file.name;
            fileInfo.classList.add('show');
            transcribeBtn.disabled = false;
            hideError();
            hideResult();
        }

        transcribeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('audio', selectedFile);
            
            transcribeBtn.disabled = true;
            loading.classList.add('show');
            hideError();
            hideResult();
            
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    transcription.textContent = data.text;
                    language.textContent = 'Idioma: ' + (data.language || 'desconhecido');
                    resultArea.classList.add('show');
                } else {
                    showError(data.error || 'Erro ao transcrever áudio');
                }
            } catch (err) {
                showError('Erro de conexão: ' + err.message);
            } finally {
                loading.classList.remove('show');
                transcribeBtn.disabled = false;
            }
        });

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }

        function hideError() {
            error.classList.remove('show');
        }

        function hideResult() {
            resultArea.classList.remove('show');
        }
    </script>
</body>
</html>
